<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F5EFE3">
  <title>En Camino</title>
  <link rel="stylesheet" href="https://use.typekit.net/asn0sci.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/entrada.css">
</head>
<body class="fondo-papel">
  <!-- Apertura: misma estructura que Carga para que el isotipo y el nombre no salten al cambiar de pantalla -->
  <main class="carga apertura">
    <span class="carga__arco carga__arco--arriba" aria-hidden="true"></span>
    <span class="carga__arco carga__arco--abajo" aria-hidden="true"></span>

    <div class="carga__centro">
      <img class="apertura__isotipo" src="imagenes/isotipo.png" alt="" width="162" height="194">
      <h1 class="carga__marca">En Camino</h1>
      <p class="carga__lema apertura__reserva" aria-hidden="true">Peregrinación a Nuestra Señora de Lourdes</p>
      <p class="carga__estado apertura__reserva" aria-hidden="true">Preparando tu camino…</p>
    </div>

    <p class="carga__lugar apertura__reserva" aria-hidden="true"><span>Santuario de Alta Gracia · Córdoba</span></p>
  </main>

  <script src="js/navegacion.js"></script>
  <script src="js/apertura.js"></script>
</body>
</html>
