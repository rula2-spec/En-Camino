<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F7F7F7">
  <title>Intenciones · En Camino</title>
  <link rel="stylesheet" href="https://use.typekit.net/asn0sci.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/botones.css">
  <link rel="stylesheet" href="css/entrada.css">
  <link rel="stylesheet" href="css/inicio.css">
  <link rel="stylesheet" href="css/intenciones.css">
</head>
<body>
  <!-- Glifos del kit. La vela sale de la pantalla final 16 -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="g-inicio" viewBox="0 0 24 24"><path d="M4 10.5 L12 4 L20 10.5 M6 9 V20 H18 V9 M10 20 V16 A2 2 0 0 1 14 16 V20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="g-mapa" viewBox="0 0 24 24"><path d="M3.5 6.5 L9 4.5 L15 6.5 L20.5 4.5 V17.5 L15 19.5 L9 17.5 L3.5 19.5 Z M9 4.5 V17.5 M15 6.5 V19.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="g-rosario" viewBox="0 0 24 24"><circle cx="12" cy="8.8" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><g fill="currentColor"><circle cx="12" cy="3.8" r="1.25"/><circle cx="15.54" cy="5.26" r="1.25"/><circle cx="17" cy="8.8" r="1.25"/><circle cx="15.54" cy="12.34" r="1.25"/><circle cx="8.46" cy="12.34" r="1.25"/><circle cx="7" cy="8.8" r="1.25"/><circle cx="8.46" cy="5.26" r="1.25"/></g><path d="M12 13.8 V21 M9.8 18.2 H14.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="g-ayuda" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7.5 V16.5 M7.5 12 H16.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="g-configuracion" viewBox="0 0 24 24"><path d="M12 3 L14.68 5.53 L18.36 5.64 L18.47 9.32 L21 12 L18.47 14.68 L18.36 18.36 L14.68 18.47 L12 21 L9.32 18.47 L5.64 18.36 L5.53 14.68 L3 12 L5.53 9.32 L5.64 5.64 L9.32 5.53 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="g-atras" viewBox="0 0 24 24"><path d="M15 4.5 L8 12 L15 19.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="g-vela" viewBox="0 0 24 24"><path d="M9 11 H15 V20.5 H9 Z M7 20.5 H17 M12 11 V9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 3.5 C13.6 5.3 13.8 6.9 12 8.2 C10.2 6.9 10.4 5.3 12 3.5 Z" fill="currentColor"/></symbol>
    <symbol id="g-favorito" viewBox="0 0 24 24"><path d="M12 19.5 C12 19.5 4.5 15 3.8 10 A4.3 4.3 0 0 1 12 7.2 A4.3 4.3 0 0 1 20.2 10 C19.5 15 12 19.5 12 19.5 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <main class="inicio intenciones">
    <header class="cabecera">
      <button class="btn-icono btn-icono--plano cabecera__volver" type="button" aria-label="Volver" data-ec="volver-intenciones" data-id="volver-intenciones"><svg class="ico" aria-hidden="true"><use href="#g-atras"/></svg></button>
      <div class="intenciones__titulos">
        <h1 class="cabecera__titulo intenciones__titulo">Intenciones</h1>
        <p class="cabecera__paso">Pedidos y agradecimientos</p>
      </div>
    </header>

    <form class="nueva-intencion" id="nueva-intencion">
      <label class="nueva-intencion__etiqueta" for="intencion-texto">Nueva intención</label>
      <textarea class="nueva-intencion__campo" id="intencion-texto" rows="3" placeholder="Escribí tu intención o tu agradecimiento…"></textarea>
      <div class="nueva-intencion__pie">
        <p class="nueva-intencion__nota">Se lee en la misa del santuario</p>
        <button class="btn btn--amarillo nueva-intencion__enviar" type="submit"><span>Enviar</span></button>
      </div>
    </form>

    <h2 class="intenciones__seccion">Tus intenciones</h2>
    <!-- Contenido de ejemplo: el diseño trae marcadores en lugar de intenciones reales -->
    <ul class="mis-intenciones" id="mis-intenciones">
      <li class="mi-intencion">
        <span class="icono-seccion icono-seccion--cobalto"><svg class="ico" aria-hidden="true"><use href="#g-vela"/></svg></span>
        <p class="mi-intencion__textos"><span class="mi-intencion__texto">[Texto de tu intención]</span><span class="mi-intencion__sub">Pedido · hoy</span></p>
        <span class="mi-intencion__estado">Enviada</span>
      </li>
      <li class="mi-intencion">
        <span class="icono-seccion icono-seccion--cobalto"><svg class="ico" aria-hidden="true"><use href="#g-favorito"/></svg></span>
        <p class="mi-intencion__textos"><span class="mi-intencion__texto">[Texto de tu agradecimiento]</span><span class="mi-intencion__sub">Gracias · ayer</span></p>
        <span class="mi-intencion__estado">Enviada</span>
      </li>
      <li class="mi-intencion">
        <span class="icono-seccion icono-seccion--cobalto"><svg class="ico" aria-hidden="true"><use href="#g-vela"/></svg></span>
        <p class="mi-intencion__textos"><span class="mi-intencion__texto">[Texto de tu intención]</span><span class="mi-intencion__sub">Pedido · borrador</span></p>
        <span class="mi-intencion__estado mi-intencion__estado--borrador">Borrador</span>
      </li>
    </ul>
  </main>

  <nav class="nav-inferior barra" aria-label="Navegación principal" style="--nav-activo: #1B2A8A">
    <button class="nav-item" type="button" data-ec="nav-inicio" data-destino="inicio"><span class="nav-item__pastilla"><svg class="ico" aria-hidden="true"><use href="#g-inicio"/></svg></span>Inicio</button>
    <button class="nav-item" type="button" data-ec="nav-mapa" data-destino="mapa"><span class="nav-item__pastilla"><svg class="ico" aria-hidden="true"><use href="#g-mapa"/></svg></span>Mapa</button>
    <button class="nav-item" type="button" data-ec="nav-espiritual" data-destino="espiritual" aria-current="page"><span class="nav-item__pastilla"><svg class="ico" aria-hidden="true"><use href="#g-rosario"/></svg></span>Punto espiritual</button>
    <button class="nav-item" type="button" data-ec="nav-ayuda" data-destino="ayuda"><span class="nav-item__pastilla"><svg class="ico" aria-hidden="true"><use href="#g-ayuda"/></svg></span>Ayuda</button>
    <button class="nav-item" type="button" data-ec="nav-ajustes" data-destino="ajustes"><span class="nav-item__pastilla"><svg class="ico" aria-hidden="true"><use href="#g-configuracion"/></svg></span>Ajustes</button>
  </nav>

  <script src="js/botones.js"></script>
  <script src="js/navegacion.js"></script>
  <script src="js/intenciones.js"></script>
</body>
</html>
